<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow System</title><style>:root{font-family:system-ui;color:#eee;background:#0c0b14}body{margin:0}main{max-width:760px;margin:auto;padding:24px}h1{letter-spacing:3px}button,input,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #555;background:#191725;color:white}button{cursor:pointer}button:hover{border-color:#a78bfa}.card{background:#181523;border:1px solid #353043;border-radius:18px;padding:20px;margin:16px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{min-height:100px}.active{outline:2px solid var(--accent,#a78bfa)}small{color:#aaa}.hidden{display:none}label{display:block;margin:12px 0}input{max-width:100%;box-sizing:border-box}#message{color:#a78bfa}</style></head><body><main><h1>☾ SHADOW SYSTEM</h1><p>Michael's private command center</p><section id="login" class="card"><h2>Owner login</h2><input id="pass" type="password" placeholder="Dashboard password"><button onclick="login()">Unlock</button></section><section id="panel" class="hidden"><div class="card"><h2>Connection: <span id="status">...</span></h2><input id="number" placeholder="2348012345678"><button onclick="pair()">Generate pairing code</button><p id="paircode"></p></div><div class="card"><h2>Choose your character</h2><div id="choices" class="choices"></div><p id="character"></p></div><div class="card"><h2>AI settings</h2><label><input type="checkbox" id="aiEnabled"> Enable AI</label><label>Provider <select id="provider"><option value="gemini">Gemini</option><option value="groq">Groq</option></select></label><button onclick="save()">Save settings</button></div><div class="card"><h2>Commands</h2><div id="commands"></div><button onclick="save()">Save command toggles</button></div></section><p id="message"></p></main><script>let token=sessionStorage.getItem('token'),data;async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error);return j}function notice(s){document.getElementById('message').textContent=s}async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pass').value})});const j=await r.json();if(!r.ok)throw Error(j.error);token=j.token;sessionStorage.setItem('token',token);load()}catch(e){notice(e.message)}}async function load(){try{data=await api('status');document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');document.getElementById('status').textContent=data.status;document.getElementById('aiEnabled').checked=data.settings.aiEnabled;document.getElementById('provider').value=data.settings.provider;document.getElementById('choices').innerHTML=Object.entries(data.characters).map(([k,c])=>`<button class="choice ${data.character===k?'active':''}" style="--accent:${c.color}" onclick="switchTo('${k}')">${c.name}<br><small>${c.title}</small></button>`).join('');document.getElementById('character').textContent='Active: '+data.characters[data.character].name;document.getElementById('commands').innerHTML=Object.entries(data.settings.commands).map(([k,v])=>`<label><input type="checkbox" data-command="${k}" ${v?'checked':''}> X${k}</label>`).join('')}catch(e){notice(e.message)}}async function save(extra={}){try{const commands=Object.fromEntries([...document.querySelectorAll('[data-command]')].map(x=>[x.dataset.command,x.checked]));await api('settings',{aiEnabled:document.getElementById('aiEnabled').checked,provider:document.getElementById('provider').value,commands,...extra});notice('Saved');load()}catch(e){notice(e.message)}}function switchTo(c){save({character:c})}async function pair(){try{const j=await api('pair',{number:document.getElementById('number').value});document.getElementById('paircode').textContent='Pairing code: '+j.code}catch(e){notice(e.message)}}if(token)load()</script></body></html>
